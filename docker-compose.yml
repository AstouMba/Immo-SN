services:
  postgres:
    image: postgres:16-alpine
    container_name: domaine-discover-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: domaine_discover_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domaine_discover_mvp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
