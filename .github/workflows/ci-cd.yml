name: CI/CD Build, Push and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://postgres:placeholder@localhost:5432/placeholder?schema=public
        run: npx prisma generate --schema=prisma/schema.prisma
      - name: Build
        run: npm run build

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.set-images.outputs.backend-image }}
      frontend-image: ${{ steps.set-images.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image names
        id: set-images
        run: |
          echo "backend-image=ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend-image=ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.set-images.outputs.backend-image }}
          build-args: |
            DATABASE_URL=postgresql://postgres:placeholder@postgres:5432/placeholder?schema=public

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.set-images.outputs.frontend-image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.REMOTE_COMPOSE_PATH || '~' }}
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-backend:latest
            docker pull ghcr.io/${{ github.repository_owner }}/${{ github.repository }}-frontend:latest
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull --ignore-pull-failures
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
